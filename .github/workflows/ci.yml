name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # test:plugin / test:synthetic 用 bun 执行；版本与本机开发环境一致。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # check-plugin.ts imports dist/index.js，必须在 build 之后执行。
      - name: Plugin wire tests
        run: npm run test:plugin

      - name: Synthetic data tests
        run: npm run test:synthetic

      # 三档规模回归全部进 CI（2026-11-15 实测：全程 ~30s，worker 峰值
      # 403MB，在 ubuntu-latest 限额内）。三档独立脚本，`-- 传参` 会被
      # base 档吃掉，不要改回 `test:scale -- medium` 的写法。
      - name: Scale regression (base)
        run: npm run test:scale

      - name: Scale regression (medium)
        run: npm run test:scale:medium

      - name: Scale regression (large)
        run: npm run test:scale:large
