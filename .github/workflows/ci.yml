name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # test:plugin / test:synthetic 用 bun 执行；版本与本机开发环境一致。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # check-plugin.ts imports dist/index.js，必须在 build 之后执行。
      - name: Plugin wire tests
        run: npm run test:plugin

      - name: Synthetic data tests
        run: npm run test:synthetic

      # 大规模性能回归只跑基准档（CI 内存有限）；medium/large 档本地跑
      # `npm run test:scale:medium` / `npm run test:scale:large`（独立脚本，
      # `-- 传参` 会被 base 档吃掉）。
      - name: Scale regression (base)
        run: npm run test:scale
