name: Publish to npm

# Releases ship only from GitHub Actions: bump the version (package.json AND
# package-lock.json root "version") and push a `v*` tag. The workflow fires on
# `v*` tag pushes only — no manual dispatch — and the tag must match
# package.json's version or the run fails before publishing.
# `prepublishOnly` blocks local `npm publish`, so this workflow is the only path.
#
# Trusted Publishing:
#   https://www.npmjs.com/package/opencode-usage-center/access
#   Repository: meiyx7/opencode-usage-center
#   Workflow:   publish.yml
#
# Releases after v0.3.1 go through npm Trusted Publishing (OIDC, provenance).
# See README "发布" for the full flow.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json $version" >&2
            exit 1
          fi

      - name: Use npm with Trusted Publishing support
        run: npm install -g npm@latest

      - name: Remove deprecated always-auth setting
        run: npm config delete always-auth || true

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guard — publish only from v* tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Publishing from $GITHUB_REF" ;;
            *) echo "Refusing to publish from non-tag ref: $GITHUB_REF" >&2; exit 1 ;;
          esac

      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$name@$version is already published; nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
